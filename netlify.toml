[build]
  command = "npm run build"
  publish = "dist"

# SPA Routing - CRÍTICO para React Router funcionar
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  
# Não redirecionar arquivos estáticos
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  
# Headers para assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
# Headers para HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
